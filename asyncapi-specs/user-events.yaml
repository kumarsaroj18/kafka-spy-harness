asyncapi: 3.0.0
info:
  title: User Events API
  version: 1.0.0
servers:
  kafka:
    host: localhost:9092
    protocol: kafka
channels:
  UserEvents:
    address: user-events
    messages:
      USER_DELETED:
        $ref: "#/components/messages/USER_DELETED"
      USER_REGISTERED:
        $ref: "#/components/messages/USER_REGISTERED"
      USER_UPDATED:
        $ref: "#/components/messages/USER_UPDATED"
operations:
  sendUserEvents:
    action: send
    channel:
      $ref: "#/channels/UserEvents"
    messages:
      - $ref: "#/channels/UserEvents/messages/USER_DELETED"
      - $ref: "#/channels/UserEvents/messages/USER_REGISTERED"
      - $ref: "#/channels/UserEvents/messages/USER_UPDATED"
components:
  messages:
    USER_DELETED:
      name: USER_DELETED
      contentType: application/json
      payload:
        type: object
        properties:
          eventType:
            type: string
            const: USER_DELETED
          userId:
            type: string
          reason:
            type: string
            enum:
              - ADMIN_ACTION
              - GDPR_ERASURE
              - USER_REQUEST
          deletedAt:
            type: string
        required:
          - deletedAt
          - eventType
          - reason
          - userId
    USER_REGISTERED:
      name: USER_REGISTERED
      contentType: application/json
      payload:
        type: object
        properties:
          eventType:
            type: string
            const: USER_REGISTERED
          userId:
            type: string
          email:
            type: string
          name:
            type: string
          country:
            type: string
            enum:
              - AU
              - BR
              - CA
              - DE
              - FR
              - GB
              - IN
              - JP
              - MX
              - US
          registeredAt:
            type: string
        required:
          - country
          - email
          - eventType
          - name
          - registeredAt
          - userId
    USER_UPDATED:
      name: USER_UPDATED
      contentType: application/json
      payload:
        type: object
        properties:
          eventType:
            type: string
            const: USER_UPDATED
          userId:
            type: string
          changedFields:
            type: array
            items:
              type: string
              enum:
                - country
                - email
                - name
          updatedAt:
            type: string
        required:
          - changedFields
          - eventType
          - updatedAt
          - userId
