asyncapi: 3.0.0
info:
  title: Order Events API
  version: 1.0.0
servers:
  kafka:
    host: localhost:9092
    protocol: kafka
channels:
  OrderEvents:
    address: order-events
    messages:
      ORDER_CANCELLED:
        $ref: "#/components/messages/ORDER_CANCELLED"
      ORDER_CREATED:
        $ref: "#/components/messages/ORDER_CREATED"
      ORDER_SHIPPED:
        $ref: "#/components/messages/ORDER_SHIPPED"
operations:
  sendOrderEvents:
    action: send
    channel:
      $ref: "#/channels/OrderEvents"
    messages:
      - $ref: "#/channels/OrderEvents/messages/ORDER_CANCELLED"
      - $ref: "#/channels/OrderEvents/messages/ORDER_CREATED"
      - $ref: "#/channels/OrderEvents/messages/ORDER_SHIPPED"
components:
  messages:
    ORDER_CANCELLED:
      name: ORDER_CANCELLED
      contentType: application/json
      payload:
        type: object
        properties:
          eventType:
            type: string
            const: ORDER_CANCELLED
          orderId:
            type: string
          reason:
            type: string
            enum:
              - CUSTOMER_REQUEST
              - FRAUD_DETECTED
              - OUT_OF_STOCK
              - PAYMENT_FAILED
          cancelledAt:
            type: string
          refundAmount:
            type: number
        required:
          - cancelledAt
          - eventType
          - orderId
          - reason
          - refundAmount
    ORDER_CREATED:
      name: ORDER_CREATED
      contentType: application/json
      payload:
        type: object
        properties:
          eventType:
            type: string
            const: ORDER_CREATED
          orderId:
            type: string
          customerId:
            type: string
          items:
            type: array
            items:
              type: object
              properties:
                productId:
                  type: string
                quantity:
                  type: integer
                unitPrice:
                  type: number
              required:
                - productId
                - quantity
                - unitPrice
          totalAmount:
            type: number
          currency:
            type: string
            enum:
              - EUR
              - GBP
              - USD
          createdAt:
            type: string
        required:
          - createdAt
          - currency
          - customerId
          - eventType
          - items
          - orderId
          - totalAmount
    ORDER_SHIPPED:
      name: ORDER_SHIPPED
      contentType: application/json
      payload:
        type: object
        properties:
          eventType:
            type: string
            const: ORDER_SHIPPED
          orderId:
            type: string
          trackingNumber:
            type: string
          carrier:
            type: string
            enum:
              - DHL
              - FEDEX
              - UPS
              - USPS
          shippedAt:
            type: string
          estimatedDelivery:
            type: string
        required:
          - carrier
          - estimatedDelivery
          - eventType
          - orderId
          - shippedAt
          - trackingNumber
